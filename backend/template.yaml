AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 10
    Runtime: provided.al2
    MemorySize: 128

Resources:

  # ============ Cognito ============

  AutoConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AutoConfirmHandler
      Handler: index.lambda_handler
      Runtime: python3.12
      InlineCode: |
        def lambda_handler(event, context):
            event['response']['autoConfirmUser'] = True
            event['response']['autoVerifyEmail'] = True
            return event

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: mychatbot-user-pool
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      LambdaConfig:
        PreSignUp: !GetAtt AutoConfirmFunction.Arn

  AutoConfirmPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AutoConfirmFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: mychatbot-web
      GenerateSecret: false
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs:
        - http://localhost:5173/
      LogoutURLs:
        - http://localhost:5173/
      SupportedIdentityProviders: [COGNITO]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "mychatbot-3-0-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admins
      UserPoolId: !Ref UserPool
      Description: Admins can view all conversations

  StudentsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: students
      UserPoolId: !Ref UserPool
      Description: Students can view only their own

  # ============ API Gateway ============

  RestApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'http://mychatbot-frontend3-0.s3-website-us-west-2.amazonaws.com'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
      

  # ============ DynamoDB (Active) ============

  ChatTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ChatMessagesTableV3
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ============ Lambda: AIChat ============

  AIChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AIChatHandler
      Handler: main
      CodeUri: ./components/AIChat
      Runtime: provided.al2
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ChatTable
      Environment:
        Variables:
          TABLE_NAME: !Ref ChatTable
          COGNITO_USER_POOL_ID: !Ref UserPool
          COGNITO_USER_POOL_CLIENT_ID: !Ref UserPoolClient
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
          COGNITO_AUDIENCE: !Ref UserPoolClient
      Events:
        AIchatApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /api/AIchat/{proxy+}
            Method: ANY

  # ============ Lambda: Auth ============

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AuthHandler
      Handler: main
      CodeUri: ./components/Auth
      Runtime: provided.al2
      Timeout: 15
      Environment:
        Variables:
          COGNITO_JWKS_URL: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/jwks.json"
      Events:
        AuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref RestApi
            Path: /api/auth/{proxy+}
            Method: ANY
            Auth:
              Authorizer: NONE

  # ============ Gateway Default Responses ============

  GatewayResponseDefault4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      StatusCode: '400'
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'http://mychatbot-frontend3-0.s3-website-us-west-2.amazonaws.com'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"

  GatewayResponseDefault5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      StatusCode: '500'
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'http://mychatbot-frontend3-0.s3-website-us-west-2.amazonaws.com'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"

  GatewayResponseUnauthorized:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: UNAUTHORIZED
      StatusCode: '401'
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'http://mychatbot-frontend3-0.s3-website-us-west-2.amazonaws.com'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"

  GatewayResponseAccessDenied:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: ACCESS_DENIED
      StatusCode: '403'
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'http://mychatbot-frontend3-0.s3-website-us-west-2.amazonaws.com'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
  


# ============ Outputs ============

Outputs:
  ApiEndpoint:
    Description: HTTPS endpoint of the API
    Value: !Sub "https://${RestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient

  HostedUiBaseUrl:
    Description: Cognito Hosted UI base url
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"

  DynamoTableName:
    Description: DynamoDB table name for chat messages
    Value: !Ref ChatTable
